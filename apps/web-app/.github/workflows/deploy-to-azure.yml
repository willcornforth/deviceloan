# GitHub Actions workflow to build and deploy the React application to Azure Blob Storage
#
# Required GitHub Secrets:
# - AZURE_STORAGE_CONNECTION_STRING: The connection string for the Azure Storage account
#   Example: "DefaultEndpointsProtocol=https;AccountName=xxx;AccountKey=xxx;EndpointSuffix=core.windows.net"
#
# Optional GitHub Secrets for Vite environment variables:
# - VITE_API_URL: API endpoint URL (or any other VITE_* variables your app needs)
# - VITE_AUTH0_DOMAIN: Auth0 domain for authentication
# - VITE_AUTH0_CLIENT_ID: Auth0 client ID
# - VITE_AUTH0_AUDIENCE: Auth0 API audience
# - VITE_API_GATEWAY_BASE_URL: API Gateway base URL

name: Build and Deploy to Azure Storage

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Limit permissions for security - only read access to contents is needed
    permissions:
      contents: read

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Step 3: Install dependencies using npm ci for faster, reliable builds
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests (Vitest) during CI
      - name: Run tests
        run: npm test

      # Step 5: Build the React application
      # Vite environment variables are passed at build time via the env section
      - name: Build React app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
          VITE_API_GATEWAY_BASE_URL: ${{ secrets.VITE_API_GATEWAY_BASE_URL }}

      # Step 6: Clear existing content from Azure Blob Storage
      # This ensures a clean deployment without leftover files from previous builds
      - name: Clear existing content from Azure Blob Storage
        run: |
          az storage blob delete-batch \
            --source '$web' \
            --connection-string "${{ secrets.PROD_AZURE_STORAGE_CONNECTION_STRING }}"

      # Step 7: Deploy the build output to Azure Blob Storage
      # The $web container is used for static website hosting in Azure Storage
      # Uses the storage account connection string for authentication
      - name: Deploy to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --destination '$web' \
            --source ./dist \
            --connection-string "${{ secrets.PROD_AZURE_STORAGE_CONNECTION_STRING }}" \
            --overwrite
